<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b343a">
  <meta name="robots" content="noindex,nofollow">
  <title>Sky &amp; Sand Zanzibar — Loading</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0b343a;color:#fff;font-family:Arial,sans-serif}
    body{display:grid;place-items:center}
    main{text-align:center;padding:2rem}
    .spinner{width:42px;height:42px;border:3px solid rgba(255,255,255,.2);border-top-color:#f2d29b;border-radius:50%;animation:s .8s linear infinite;margin:auto}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main><div class="spinner" aria-hidden="true"></div><p>Sky &amp; Sand Zanzibar</p></main>
  <script>
    (async()=>{
      try{
        if(!('DecompressionStream' in window)) throw new Error('This browser does not support the preview decompressor.');
        const parts=await Promise.all([...Array(7)].map((_,i)=>fetch(`chunks/${i}.txt`).then(r=>{
          if(!r.ok) throw new Error(`Could not load preview chunk ${i}.`);
          return r.text();
        })));
        const bytes=Uint8Array.from(atob(parts.join('').trim()),c=>c.charCodeAt(0));
        const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        const html=await new Response(stream).text();
        document.open();
        document.write(html);
        document.close();
      }catch(error){
        console.error(error);
        document.body.innerHTML='<main><h1>Sky &amp; Sand Zanzibar</h1><p>The preview could not load in this browser. Please open it in a current version of Chrome, Safari, Edge or Firefox.</p></main>';
      }
    })();
  </script>
</body>
</html>
