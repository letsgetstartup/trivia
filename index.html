<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOA Hotel & Spa Zanzibar</title><style>html,body{margin:0;min-height:100%;background:#102c2b;color:#fff;font-family:Arial,sans-serif}#loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}</style></head><body><div id="loading">TOA Hotel & Spa · Zanzibar</div><script>(async()=>{const ok=['en','he','de','fr','sw'];const q=new URLSearchParams(location.search).get('lang');const auto=(navigator.language||'en').slice(0,2);const lang=ok.includes(q)?q:(ok.includes(auto)?auto:'en');async function read(u){const x=await fetch(u,{cache:'no-store'});if(!x.ok)throw new Error(u+' '+x.status);const b=await x.arrayBuffer(),v=new Uint8Array(b);if(v[0]===31&&v[1]===139&&'DecompressionStream'in window){return new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}return new TextDecoder().decode(b)}try{const [html0,css]=await Promise.all([read(`./parts/${lang}.html.gzbin`),read('./parts/site.css.gzbin')]);const html=html0.replace('<link rel="stylesheet" href="./assets/css/site.css">',`<style>${css}</style>`);document.open();document.write(html);document.close()}catch(e){document.getElementById('loading').innerHTML='<h1>TOA Hotel & Spa</h1><p>Unable to load preview.</p>';console.error(e)}})();</script></body></html>
